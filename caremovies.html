</div>

<footer>
    <p>© 2026 Care Movies</p>
    <p>Uganda's VJ Movie Platform</p>
</footer>

<script>

const SERVER_URL = window.location.origin;

const moviesContainer =
    document.getElementById("movies");

const playerSection =
    document.getElementById("playerSection");

const videoPlayer =
    document.getElementById("videoPlayer");

const playerTitle =
    document.getElementById("playerTitle");

const playerDescription =
    document.getElementById("playerDescription");

const soundButton =
    document.getElementById("soundButton");

const volumeSlider =
    document.getElementById("volumeSlider");

const volumeText =
    document.getElementById("volumeText");


async function loadMovies() {

    try {

        const response =
            await fetch(
                SERVER_URL + "/api/movies"
            );

        if (!response.ok) {
            throw new Error(
                "Server returned " +
                response.status
            );
        }

        const data =
            await response.json();

        const movies =
            Array.isArray(data)
                ? data
                : data.movies;

        moviesContainer.innerHTML = "";

        if (!movies || movies.length === 0) {

            moviesContainer.innerHTML = `
                <div class="empty">
                    No movies have been uploaded yet.
                </div>
            `;

            return;
        }

        movies.forEach(function(movie) {

            const card =
                document.createElement("div");

            card.className = "movie-card";

            let poster =
                movie.posterName || "";

            if (
                poster &&
                !poster.startsWith("http://") &&
                !poster.startsWith("https://")
            ) {

                poster =
                    SERVER_URL +
                    "/images/" +
                    poster.replace(/^\/+/, "");

            }

            let posterHTML = "";

            if (poster) {

                posterHTML = `
                    <img
                        src="${poster}"
                        class="poster"
                        alt="${escapeHTML(
                            movie.title || "Movie"
                        )}"
                    >
                `;

            } else {

                posterHTML = `
                    <div class="poster"></div>
                `;

            }

            card.innerHTML = `

                ${posterHTML}

                <div class="movie-info">

                    <div class="movie-title">
                        ${escapeHTML(
                            movie.title ||
                            "Untitled Movie"
                        )}
                    </div>

                    <div class="category">
                        ${escapeHTML(
                            movie.category ||
                            "Movie"
                        )}
                    </div>

                    <div class="description">
                        ${escapeHTML(
                            movie.description ||
                            "No description available."
                        )}
                    </div>

                    <button
                        class="watch-btn"
                        type="button"
                    >
                        ▶ Watch Movie
                    </button>

                </div>

            `;

            const watchButton =
                card.querySelector(".watch-btn");

            watchButton.addEventListener(
                "click",
                function() {
                    watchMovie(movie);
                }
            );

            moviesContainer.appendChild(card);

        });

    }

    catch (error) {

        console.error(
            "Movie loading error:",
            error
        );

        moviesContainer.innerHTML = `

            <div class="empty">

                ❌ Could not connect to movie database.

                <br><br>

                Make sure the Care Movies server
                is running on port 8090.

            </div>

        `;

    }

}


function watchMovie(movie) {

    const videoName =
        movie.videoName;

    if (!videoName) {

        alert(
            "This movie does not have a video file."
        );

        return;
    }

    const videoUrl =
        SERVER_URL +
        "/videos/" +
        encodeURIComponent(videoName);

    console.log(
        "VIDEO URL:",
        videoUrl
    );

    playerTitle.textContent =
        movie.title || "Movie";

    playerDescription.textContent =
        movie.description || "";

    videoPlayer.pause();

    videoPlayer.muted = false;

    videoPlayer.volume = 1.0;

    soundButton.textContent =
        "🔊 Sound ON";

    volumeSlider.value = 1;

    volumeText.textContent =
        "Volume: 100%";

    videoPlayer.src =
        videoUrl;

    playerSection.style.display =
        "block";

    videoPlayer.load();

    /*
       IMPORTANT:
       We do NOT automatically play the video here.

       The browser will let the user press
       the normal Play button, which avoids
       autoplay sound restrictions.
    */

}


function toggleSound() {

    if (videoPlayer.muted) {

        videoPlayer.muted = false;

        videoPlayer.volume = 1;

        soundButton.textContent =
            "🔊 Sound ON";

        volumeSlider.value = 1;

        volumeText.textContent =
            "Volume: 100%";

    }

    else {

        videoPlayer.muted = true;

        soundButton.textContent =
            "🔇 Sound OFF";

        volumeText.textContent =
            "Volume: Muted";

    }

}


volumeSlider.addEventListener(
    "input",
    function() {

        const value =
            Number(volumeSlider.value);

        videoPlayer.muted = false;

        videoPlayer.volume =
            value;

        if (value <= 0) {

            soundButton.textContent =
                "🔇 Sound OFF";

            volumeText.textContent =
                "Volume: 0%";

        }

        else {

            soundButton.textContent =
                "🔊 Sound ON";

            volumeText.textContent =
                "Volume: " +
                Math.round(value * 100) +
                "%";

        }

    }
);


videoPlayer.addEventListener(
    "volumechange",
    function() {

        if (videoPlayer.muted) {

            soundButton.textContent =
                "🔇 Sound OFF";

            volumeText.textContent =
                "Volume: Muted";

            return;
        }

        if (videoPlayer.volume === 0) {

            soundButton.textContent =
                "🔇 Sound OFF";

            volumeText.textContent =
                "Volume: 0%";

            return;
        }

        soundButton.textContent =
            "🔊 Sound ON";

        volumeText.textContent =
            "Volume: " +
            Math.round(
                videoPlayer.volume * 100
            ) +
            "%";

        volumeSlider.value =
            videoPlayer.volume;

    }
);


videoPlayer.addEventListener(
    "error",
    function() {

        console.error(
            "VIDEO ERROR:",
            videoPlayer.error
        );

        alert(
            "The video could not be played. Check the Care Movies server."
        );

    }
);


function closePlayer() {

    videoPlayer.pause();

    videoPlayer.removeAttribute("src");

    videoPlayer.load();

    playerSection.style.display =
        "none";

}


function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text == null
            ? ""
            : String(text);

    return div.innerHTML;

}


loadMovies();

</script>
